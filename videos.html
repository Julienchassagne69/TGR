<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidéos et astuces — The Gamer Rich</title>
<link rel="stylesheet" href="css/style.css?v=34">
</head>
<body>
<div class="bg-fx"></div>
<div id="nav-root"></div>

<main class="container section">
  <div class="section-head">
    <h1>Vidéos et astuces</h1>
    <a href="publier.html" class="btn btn-primary btn-sm">+ Publier</a>
  </div>

  <div class="tabs" id="catTabs"></div>
  <div class="grid grid-4" id="grid"></div>
  <div style="text-align:center;margin-top:20px" id="loadMoreWrap"></div>

  <h2 style="margin-top:50px">Astuces récentes</h2>
  <div class="grid grid-2" id="tipsGrid"></div>
</main>

<div id="footer-root"></div>

<script src="js/data.js?v=34"></script>
<script src="js/economy.js?v=34"></script>
<script src="js/i18n.js?v=34"></script>
<script src="js/app.js?v=34"></script>
<script>
const db = loadDB();
let cat = 'Tout';
const cats = ['Tout', ...CATEGORIES];
const PAGE_SIZE = 24;
let visibleCount = PAGE_SIZE;

document.getElementById('catTabs').innerHTML = cats.map(c=>`<div class="tab ${c==='Tout'?'active':''}" data-c="${c}">${c}</div>`).join('');
document.querySelectorAll('#catTabs .tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('#catTabs .tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    cat = t.dataset.c;
    visibleCount = PAGE_SIZE;
    render();
  });
});

function byUser(id){ return db.users.find(u=>u.id===id); }

function render(){
  const list = db.videos.filter(v=> v.status==='published' && (cat==='Tout' || v.category===cat))
    .sort((a,b)=> new Date(b.publishedAt)-new Date(a.publishedAt));
  const shown = list.slice(0, visibleCount);
  document.getElementById('grid').innerHTML = shown.map(v=>{
    const u = byUser(v.userId);
    const info = videoChallengeRank(db, v);
    return `<a href="video.html?id=${v.id}" class="card">
      <div class="card-thumb myvideo-thumb" style="${thumbBg(v.id)}">
        ${v.embedUrl && v.embedUrl.startsWith('idb:') ? `<video class="card-video" playsinline muted loop hidden data-video-key="${v.embedUrl.slice(4)}"></video>` : ''}
        ${thumbBadge(v.thumbnail)}<span class="play-btn">▶</span>${v.durationSec? `<span class="clip-length">0:${String(v.durationSec).padStart(2,'0')}</span>`:''}</div>
      <div class="card-body">
        ${info.challenge ? `<span style="font-size:.66rem;font-weight:700;color:var(--gold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;margin-bottom:4px">${info.challenge.title}</span>` : `<span class="card-tag">${v.category}</span>`}
        <div class="card-title">${v.title}</div>
        <div class="card-author"><img src="${avatarSrc(u)}"> @${u.username}</div>
      </div>
      <div class="card-foot"><span>❤️ ${fmtCompact(v.likes)}</span><span>${timeAgo(v.publishedAt)}</span></div>
    </a>`;
  }).join('') || `<div class="empty">Aucune vidéo dans cette catégorie.</div>`;
  mountLazyCardVideos(document.getElementById('grid'));

  const wrap = document.getElementById('loadMoreWrap');
  if(list.length > visibleCount){
    wrap.innerHTML = `<button class="btn btn-outline" id="loadMoreBtn">Charger plus (${list.length-visibleCount} restantes)</button>`;
    document.getElementById('loadMoreBtn').addEventListener('click', ()=>{
      visibleCount += PAGE_SIZE;
      render();
    });
  } else {
    wrap.innerHTML = '';
  }
}
render();

document.getElementById('tipsGrid').innerHTML = db.tips.map(t=>{
  const u = byUser(t.userId);
  return `<div class="card" style="padding:18px">
    <span class="card-tag">${t.category}</span>
    <h3 style="margin:6px 0">${t.title}</h3>
    <p style="font-size:.85rem">${t.text}</p>
    <div style="font-size:.78rem;color:var(--text-faint)">Par ${u.display} · ${new Date(t.createdAt).toLocaleDateString('fr-FR')}</div>
  </div>`;
}).join('');
</script>
</body>
</html>
