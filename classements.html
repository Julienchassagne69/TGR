<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classements — The Gamer Rich</title>
<link rel="stylesheet" href="css/style.css?v=33">
</head>
<body>
<div class="bg-fx"></div>
<div id="nav-root"></div>

<main class="container section">
  <h1>Classements</h1>
  <p>Les mesures ne sont jamais mélangées entre elles : victoires, popularité et soutien sont classés séparément.</p>

  <div class="tabs" id="tabs">
    <div class="tab active" data-t="trophies">🎖️ Trophées</div>
    <div class="tab" data-t="wins">Victoires</div>
    <div class="tab" data-t="followers">Popularité (abonnés)</div>
    <div class="tab" data-t="stars">Gold Stars reçues</div>
    <div class="tab" data-t="challenge">Par défi</div>
  </div>

  <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap" id="filters">
    <select id="countryFilter"><option value="">Tous les pays</option></select>
    <select id="periodFilter">
      <option value="all">Toute période</option>
      <option value="month">Ce mois-ci</option>
      <option value="week">Cette semaine</option>
    </select>
    <select id="challengeFilter" style="display:none"></select>
  </div>

  <p style="font-size:.78rem;color:var(--text-faint)" id="ruleNote"></p>
  <div id="list"></div>
</main>

<div id="footer-root"></div>

<script src="js/data.js?v=33"></script>
<script src="js/economy.js?v=33"></script>
<script src="js/i18n.js?v=33"></script>
<script src="js/app.js?v=33"></script>
<script>
const db = loadDB();
let mode = 'trophies';

const countries = [...new Set(db.users.map(u=>u.country))];
document.getElementById('countryFilter').innerHTML += countries.map(c=>`<option value="${c}">${c}</option>`).join('');
document.getElementById('challengeFilter').innerHTML = db.challenges.filter(c=>c.approvalStatus!=='pending').map(c=>`<option value="${c.id}">${c.title}</option>`).join('');

document.querySelectorAll('#tabs .tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('#tabs .tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    mode = t.dataset.t;
    document.getElementById('challengeFilter').style.display = mode==='challenge' ? 'inline-block' : 'none';
    render();
  });
});
document.getElementById('countryFilter').addEventListener('change', render);
document.getElementById('periodFilter').addEventListener('change', render);
document.getElementById('challengeFilter').addEventListener('change', render);

const notes = {
  trophies:"Classement par trophées : 1ère place d'un défi = 3 🎖️, 2e place = 2 🎖️, 3e place = 1 🎖️. Cumulés sur tous les défis — une façon de progresser même sans remporter la victoire.",
  wins:"Classement par nombre de victoires confirmées en défi. Égalité : ancienneté du dernier gain. Comptes suspendus exclus.",
  followers:"Classement par nombre d'abonnés sur la plateforme. Ne détermine pas de trophées.",
  stars:"Classement par Gold Stars reçues sur les participations. Reflète le soutien, pas une victoire officielle.",
  challenge:`Classement officiel du défi sélectionné : ❤️ j'aime + Gold Stars × ${LIKES_PER_GOLD_STAR}.`
};

function render(){
  document.getElementById('ruleNote').textContent = notes[mode];
  const country = document.getElementById('countryFilter').value;
  let rows = [];

  if(mode==='challenge'){
    const cid = document.getElementById('challengeFilter').value || db.challenges[0].id;
    rows = db.submissions.filter(s=>s.challengeId===cid && s.status==='published')
      .map(s=>{ const v = db.videos.find(vi=>vi.id===s.videoId); return { user: db.users.find(u=>u.id===s.userId), value: scoreOf(v,s), label: `❤️ ${fmtNum(v.likes)} · ★${s.goldStars}` }; });
  } else {
    let users = db.users.filter(u => u.accountType!=='brand' && (!country || u.country===country));
    if(mode==='trophies') rows = users.map(u=>({user:u, value:u.trophies||0, label:`${u.trophies||0} 🎖️`}));
    if(mode==='wins') rows = users.map(u=>({user:u, value:u.wins, label:`${u.wins} 🏆`}));
    if(mode==='followers') rows = users.map(u=>({user:u, value:u.followers, label:`${fmtNum(u.followers)} abonnés`}));
    if(mode==='stars') rows = users.map(u=>({user:u, value: db.submissions.filter(s=>s.userId===u.id).reduce((a,s)=>a+s.goldStars,0), label:null}));
    if(mode==='stars') rows.forEach(r=> r.label = `★ ${r.value}`);
  }

  rows = rows.filter(r=>!country || r.user.country===country).sort((a,b)=>b.value-a.value);

  const RANK_CAP = 100;
  const shown = rows.slice(0, RANK_CAP);
  document.getElementById('list').innerHTML = shown.map((r,i)=>`
    <div class="rank-row">
      <div class="rank-num">${i+1}</div>
      <div class="rank-avatar"><img src="${avatarSrc(r.user)}"></div>
      <div class="rank-name"><a href="profil.html?u=${r.user.id}">${r.user.display}</a> ${levelBadge(r.user.level)}
        <small>${r.user.country} ${r.user.isLive && r.user.liveLink?' · <span class="live-dot">LIVE</span>':''}</small>
      </div>
      <div class="rank-value">${r.label}</div>
    </div>
  `).join('') || `<div class="empty">Aucune donnée.</div>`;
  if(rows.length > RANK_CAP){
    document.getElementById('list').innerHTML += `<p style="text-align:center;color:var(--text-faint);font-size:.8rem;margin-top:14px">Classement limité au top ${RANK_CAP} (${rows.length} joueurs au total dans cette vue).</p>`;
  }
}
render();
</script>
</body>
</html>
